<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clases | RFA.Learning</title>
  <link rel="stylesheet" href="../css/clases.css">
  <link rel="stylesheet" href="../css/shared.css">
  <link rel="stylesheet" href="../css/modern.css">
</head>
<body>
  <a href="#classes-explore" class="skip-link" data-i18n="skip.classes">Ir a las clases</a>
  <header class="topbar">
    <div class="topbar-brand">
      <span class="brand-icon"></span>
      <h1 data-i18n="classes.title">Clases</h1>
    </div>
    <nav>
      <a href="/home" data-i18n="nav.home">Home</a>
      <a href="/dashboard" id="dashboard-link" class="hidden" data-i18n="nav.dashboard">Dashboard</a>
      <a href="/profile" class="btn btn-small btn-ghost" data-i18n="nav.perfil">Perfil</a>
      <button id="logout-btn" class="btn btn-small btn-danger" data-i18n="nav.salir">Salir</button>
    </nav>
  </header>

  <main class="container landing">
    <!-- ── Hero ── -->
    <section class="hero-image-bg classes-hero" style="min-height:320px;">
      <img src="../assets/1.jpeg" alt="" aria-hidden="true">
      <div class="classes-hero-content">
        <span class="kicker" data-i18n="classes.kicker">Módulos</span>
        <h1 data-i18n="classes.subtitle">Explora tu aprendizaje</h1>
        <p class="hero-sub" id="classes-hero-sub" data-i18n="classes.pageHint">Domina el vocabulario del fútbol, módulo por módulo.</p>
        <div class="classes-hero-stats" id="classes-hero-stats">
          <div class="hero-stat">
            <span class="hero-stat-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            </span>
            <strong id="hero-total-classes">0</strong>
            <span data-i18n="classes.availableModules">Módulos</span>
          </div>
          <div class="hero-stat">
            <span class="hero-stat-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </span>
            <strong id="hero-completed">0</strong>
            <span data-i18n="classes.completedOnPageLabel">Completados</span>
          </div>
          <div class="hero-stat">
            <span class="hero-stat-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            </span>
            <strong id="hero-favorites">0</strong>
            <span data-i18n="classes.favoriteModules">Favoritos</span>
          </div>
        </div>
      </div>
    </section>

    <!-- ── Level Tabs ── -->
    <section class="classes-level-tabs" id="classes-level-tabs">
      <button class="level-tab active" data-level="" data-i18n="classes.allLevels">Todos</button>
      <button class="level-tab" data-level="Beginner" data-i18n="classes.levelBeginner">Beginner</button>
      <button class="level-tab" data-level="Intermediate" data-i18n="classes.levelIntermediate">Intermediate</button>
      <button class="level-tab" data-level="Advanced" data-i18n="classes.levelAdvanced">Advanced</button>
    </section>

    <!-- ── Filter Bar ── -->
    <section class="filter-bar-modern" id="classes-filter-bar">
      <div class="filter-search-wrap">
        <span class="filter-search-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input id="search-input" type="search" placeholder="Buscar clase..." data-i18n-placeholder="classes.searchPlaceholder" aria-label="Buscar clases">
      </div>
      <select id="filter-category" class="filter-select" data-i18n-aria="classes.allCategories" aria-label="Filtrar por categoría">
        <option value="" data-i18n="classes.allCategories">Todas las categorías</option>
      </select>
      <div class="speech-control-compact">
        <select id="speech-language" class="filter-select speech-select">
          <option value="en">EN</option>
          <option value="es">ES</option>
        </select>
      </div>
    </section>

    <!-- ── Highlights ── -->
    <section id="classes-highlights" class="classes-highlights-modern"></section>

    <!-- ── Class Grid ── -->
    <section id="classes-explore" class="classes-explore-section">
      <div class="section-head">
        <span class="kicker">Biblioteca</span>
        <h3>Tus módulos</h3>
      </div>
      <div id="classes-container" class="classes-grid"></div>
      <div id="classes-pagination" class="pagination-modern"></div>
    </section>
  </main>

  <script src="../js/i18n.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/shared.js"></script>
  <script src="../js/clases.js"></script>
</body>
</html>
